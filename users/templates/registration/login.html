{% extends "base.html" %}
{% block content %}
    <div class="w-full lg:w-2/3 mx-auto mt-10 mb-10 p-6 border rounded-lg shadow-lg">
        <h2 class="text-2xl font-bold mb-6 text-gray-800">Sign In</h2>
        <form method="POST">
            {% csrf_token %}
            {% if request.GET.next %}
            <input type="hidden" name="next" value="{{ request.GET.next }}">
            {% endif %}
            {% if form.non_field_errors %}
            <div class="mb-4 bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded">
                {% for error in form.non_field_errors %}
                    <p>{{ error }}</p>
                {% endfor %}
            </div>
            {% endif %}
            {{ form.as_p }}
            <button class='bg-red-400 hover:bg-red-500 px-4 py-2 rounded-lg mt-4 text-white font-semibold transition' type="submit">Sign In</button>
        </form>
    </div>
{% endblock content %}
